<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FY27 S1 KMP&内容规划时间轴</title>
    <style>
        :root {
            --primary: #2563EB;
            --primary-light: #3B82F6;
            --primary-dark: #1E40AF;
            --accent: #10B981;
            --text: #1F2937;
            --text-secondary: #6B7280;
            --bg: #FFFFFF;
            --card-bg: #EFF6FF;
            --card-border: #BFDBFE;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
        }
        .container {
            padding: 40px 30px 50px;
        }
        svg {
            display: block;
        }
    </style>
</head>
<body>
<div class="container">
<svg width="1200" height="520" viewBox="0 0 1200 520">
    <defs>
        <linearGradient id="spanGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#2563EB;stop-opacity:0.85" />
            <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:0.70" />
        </linearGradient>
        <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="116%">
            <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1E40AF" flood-opacity="0.10" />
        </filter>
        <filter id="nodeShadow" x="-50%" y="-50%" width="200%" height="200%">
            <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#2563EB" flood-opacity="0.25" />
        </filter>
    </defs>

    <!-- ==================== 标题 ==================== -->
    <text x="600" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#1F2937"
          font-family="'Inter','PingFang SC','Microsoft YaHei',sans-serif">
        FY27 S1 KMP &amp; 内容规划时间轴
    </text>

    <!-- ==================== 持续性事项横跨条 ==================== -->
    <rect x="100" y="72" width="920" height="34" rx="17" fill="url(#spanGradient)" />
    <text x="560" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF"
          font-family="'Inter','PingFang SC','Microsoft YaHei',sans-serif">
        4 – 9 月：内容、PDP、交易等业务 KMP 支撑
    </text>

    <!-- ==================== 时间轴主线 ==================== -->
    <line x1="100" y1="150" x2="1100" y2="150" stroke="#2563EB" stroke-width="3" stroke-linecap="round" />

    <!-- 起始端点 -->
    <circle cx="100" cy="150" r="5" fill="#2563EB" />
    <!-- 结束箭头 -->
    <polygon points="1100,150 1088,144 1088,156" fill="#2563EB" />

    <!-- ==================== 节点: 4月 ==================== -->
    <circle cx="200" cy="150" r="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="3" filter="url(#nodeShadow)" />
    <circle cx="200" cy="150" r="4" fill="#2563EB" />
    <text x="200" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#2563EB"
          font-family="'Inter','PingFang SC','Microsoft YaHei',sans-serif">4 月</text>

    <!-- 卡片 4月 -->
    <rect x="118" y="198" width="164" height="82" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5" filter="url(#cardShadow)" />
    <text x="136" y="224" font-size="13" fill="#1F2937" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
        <tspan x="136" dy="0">• Figma 转码优化</tspan>
        <tspan x="136" dy="24">• iOS 源码调试编译</tspan>
        <tspan x="136" dy="22">  耗时优化</tspan>
    </text>

    <!-- ==================== 节点: 5月 ==================== -->
    <circle cx="400" cy="150" r="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="3" filter="url(#nodeShadow)" />
    <circle cx="400" cy="150" r="4" fill="#2563EB" />
    <text x="400" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#2563EB"
          font-family="'Inter','PingFang SC','Microsoft YaHei',sans-serif">5 月</text>

    <!-- 卡片 5月 -->
    <rect x="310" y="198" width="180" height="126" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5" filter="url(#cardShadow)" />
    <text x="328" y="224" font-size="13" fill="#1F2937" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
        <tspan x="328" dy="0">• 共建规范</tspan>
        <tspan x="328" dy="22">• KMP AI 迁移框架</tspan>
        <tspan x="328" dy="22">  （前、中）</tspan>
        <tspan x="328" dy="22">• KMP CLI</tspan>
        <tspan x="328" dy="22">• 实时预览优化</tspan>
    </text>

    <!-- ==================== 节点: 6月 ==================== -->
    <circle cx="600" cy="150" r="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="3" filter="url(#nodeShadow)" />
    <circle cx="600" cy="150" r="4" fill="#2563EB" />
    <text x="600" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#2563EB"
          font-family="'Inter','PingFang SC','Microsoft YaHei',sans-serif">6 月</text>

    <!-- 卡片 6月 -->
    <rect x="510" y="198" width="180" height="126" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5" filter="url(#cardShadow)" />
    <text x="528" y="224" font-size="13" fill="#1F2937" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
        <tspan x="528" dy="0">• KMP AI 迁移框架</tspan>
        <tspan x="528" dy="22">  （后）</tspan>
        <tspan x="528" dy="22">• 业务 KMP 迁移</tspan>
        <tspan x="528" dy="22">• UI 组件库</tspan>
        <tspan x="528" dy="22">• KCP Linter</tspan>
    </text>

    <!-- ==================== 节点: 7月 ==================== -->
    <circle cx="800" cy="150" r="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="3" filter="url(#nodeShadow)" />
    <circle cx="800" cy="150" r="4" fill="#2563EB" />
    <text x="800" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#2563EB"
          font-family="'Inter','PingFang SC','Microsoft YaHei',sans-serif">7 月</text>

    <!-- 卡片 7月 -->
    <rect x="718" y="198" width="164" height="82" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5" filter="url(#cardShadow)" />
    <text x="736" y="224" font-size="13" fill="#1F2937" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
        <tspan x="736" dy="0">• KMP 业务迁移放量</tspan>
        <tspan x="736" dy="24">• AI 自动化测试</tspan>
    </text>

    <!-- ==================== 节点: 8月 ==================== -->
    <circle cx="1000" cy="150" r="10" fill="#FFFFFF" stroke="#10B981" stroke-width="3" filter="url(#nodeShadow)" />
    <circle cx="1000" cy="150" r="4" fill="#10B981" />
    <text x="1000" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#10B981"
          font-family="'Inter','PingFang SC','Microsoft YaHei',sans-serif">8 月</text>

    <!-- 卡片 8月 (收尾，用绿色强调) -->
    <rect x="930" y="198" width="140" height="52" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5" filter="url(#cardShadow)" />
    <text x="948" y="230" font-size="13" fill="#065F46" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
        • 包大小收尾
    </text>

    <!-- ==================== 底部说明 ==================== -->
    <text x="600" y="500" text-anchor="middle" font-size="12" fill="#9CA3AF"
          font-family="'Inter','PingFang SC','Microsoft YaHei',sans-serif">
        FY27 S1 · KMP &amp; 内容团队
    </text>

</svg>
</div>
</body>
</html>
